[package]
name = "opensea-mint"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[lib]
name = "opensea_mint"
path = "src/lib.rs"

[[bin]]
name = "opensea-mint"
path = "src/main.rs"

[dependencies]
alloy-eip7702 = { version = "=0.6.3", features = ["k256"] }
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["k256", "rlp", "std"] }
alloy-rlp = { version = "=0.3.16", features = ["derive"] }
alloy-sol-types = "=1.6.1"
# Manifest encryption at rest: Argon2id derives a key from the operator
# passphrase, ChaCha20-Poly1305 seals the manifest. Both are pure-Rust
# RustCrypto crates (no new C toolchain in the build image, unlike aws-lc-sys)
# and constant-time in software, which matters on a container with no
# guaranteed AES-NI.
argon2 = { version = "=0.5.3", features = ["std", "zeroize"] }
# BIP-39 mnemonic generation (12 words, 128-bit entropy) + BIP-32 HD key
# derivation (Ethereum BIP-44 path m/44'/60'/0'/0/i). Users write down 12
# words and can recover all wallets independently of this bot. bip39 handles
# phrase generation/parsing with configurable word count; bip32 provides the
# HD derivation via the same k256 the rest of the crate uses.
bytes = "=1.12.1"
bip32 = { version = "=0.5.2", features = ["secp256k1"] }
bip39 = { version = "=2.2.2", features = ["rand", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", features = ["getrandom", "zeroize"] }
clap = { version = "=4.6.0", features = ["derive"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["windows"] }
dotenvy = "=0.15.7"
hex = "=0.4.3"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["cookies", "http2", "json", "rustls"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.16"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = { version = "=2.5.7", features = ["serde"] }
zeroize = { version = "=1.8.2", features = ["serde"] }

[dev-dependencies]
assert_cmd = "=2.0.17"
predicates = "=3.1.3"
tempfile = "=3.22.0"
# A loopback listener lets the blast tests assert the exact bytes that hit the
# wire (notably the Content-Type header) without a mock-server dependency.
tokio = { version = "=1.53.1", features = ["io-util", "net"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
