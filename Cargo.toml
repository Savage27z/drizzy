[package]
name = "opensea-mint"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[lib]
name = "opensea_mint"
path = "src/lib.rs"

[[bin]]
name = "opensea-mint"
path = "src/main.rs"

[dependencies]
alloy-eip7702 = { version = "=0.6.3", features = ["k256"] }
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["k256", "rlp", "std"] }
alloy-rlp = { version = "=0.3.16", features = ["derive"] }
alloy-sol-types = "=1.6.1"
clap = { version = "=4.6.0", features = ["derive"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["windows"] }
dotenvy = "=0.15.7"
hex = "=0.4.3"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["cookies", "http2", "json", "rustls"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.16"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = { version = "=2.5.7", features = ["serde"] }
zeroize = { version = "=1.8.2", features = ["serde"] }

[dev-dependencies]
assert_cmd = "=2.0.17"
predicates = "=3.1.3"
tempfile = "=3.22.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
